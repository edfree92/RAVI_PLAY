<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAVI_PLAY</title>

<style>
  body{
    margin:0; background:#000;
    display:flex; justify-content:center; align-items:center;
    height:100vh; font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
  }
  #container{ position:relative; width:100%; height:100%; max-width:1920px; max-height:1080px; }
  #scene-img{ width:100%; height:100%; object-fit:contain; display:block; }

  .btn{
    position:absolute; padding:12px 24px;
    background:rgba(0,0,0,.85); color:#00eaff;
    border:2px solid #00eaff; cursor:pointer;
    font-size:1.1rem; font-weight:800; text-transform:uppercase;
    box-shadow:0 0 10px rgba(0,234,255,.25);
    transition:all .2s ease; z-index:10; user-select:none;
  }
  .btn:hover{ background:#00eaff; color:#000; box-shadow:0 0 20px rgba(0,234,255,.8); transform:scale(1.03); }

  .pos-top-left{ top:30px; left:30px; }
  .pos-top-right{ top:30px; right:30px; }
  .pos-main-left{ bottom:15%; left:15%; width:320px; text-align:center; }
  .pos-main-right{ bottom:15%; right:15%; width:320px; text-align:center; }
  .pos-center-left{ top:50%; left:20%; transform:translateY(-50%); }
  .pos-center-right{ top:50%; right:20%; transform:translateY(-50%); }
  .pos-center-bottom{ bottom:10%; left:50%; transform:translateX(-50%); width:360px; text-align:center; }

  #toast{
    position:absolute; left:16px; bottom:16px;
    padding:10px 12px; border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.65); color:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);
    display:none; z-index:30; max-width:70ch;
  }
</style>
</head>

  function sceneImageFile(sceneId){
    const base = escenasConfig[sceneId]?.image ?? sceneId;
    return BASE_PATH + base + ".jpg";
  }

  function loadScene(sceneId){
    const config = escenasConfig[sceneId];
    if(!config){ showToast("⚠️ No existe escena: " + sceneId); return; }

    // Imagen
    const img = document.getElementById("scene-img");
    img.onerror = () => showToast("⚠️ Falta imagen: " + sceneImageFile(sceneId));
    img.src = sceneImageFile(sceneId);

    // Botones
    const layer = document.getElementById("buttons-layer");
    layer.innerHTML = "";
    (config.buttons || []).forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "btn " + b.class;
      btn.textContent = b.text;
      btn.onclick = ()=> loadScene(b.target);
      layer.appendChild(btn);
    });
  }

  window.onload = ()=> loadScene("pantalla_principal");
  window.addEventListener("keydown", (e)=>{ if(e.key==="Escape") loadScene("pantalla_principal"); });

</html>
